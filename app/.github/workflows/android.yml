name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix gradlew
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Creating wrapper"
            gradle wrapper --gradle-version 8.6
          fi
          chmod +x ./gradlew
          ls -la
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace -PgeminiKey=dummy_key_for_github_only
        env:
          GEMINI_API_KEY: dummy_key_for_github_only
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK-FINAL
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Release APK
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v3.0-FINAL-${{ github.run_number }}
          name: ResumeBuilder ATS Optimizer v1.0 - Dayaram Orb - Build ${{ github.run_number }}
          body: "ResumeBuilder ATS Optimizer - Design by Dayaram Chouhan - MYRA Voice Assistant & Auto Job Apply System - 100% On-Device Privacy"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
